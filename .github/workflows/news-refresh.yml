name: News Refresh

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news-only refresh
        env:
          GRIGORI_ADMIN_SECRET: ${{ secrets.GRIGORI_ADMIN_SECRET }}
          GRIGORI_REFRESH_URL: https://grigori.oryth.io/api/v1/admin/refresh?mode=news&source=github_action
          GRIGORI_HEALTH_URL: https://grigori.oryth.io/api/v1/health
        run: |
          set -euo pipefail
          echo "UTC run timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Endpoint: $GRIGORI_REFRESH_URL"

          ATTEMPT=1
          MAX_ATTEMPTS=2
          SUCCESS=0
          FINAL_BODY=""
          FINAL_STATUS=""

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"
            HTTP_BODY=$(mktemp)
            HTTP_CODE=$(curl -sS --max-time 60 --connect-timeout 20 -o "$HTTP_BODY" -w "%{http_code}" \
              -X POST "$GRIGORI_REFRESH_URL" \
              -H "Authorization: Bearer $GRIGORI_ADMIN_SECRET" \
              -H "Content-Type: application/json")

            echo "HTTP status: $HTTP_CODE"
            echo "Response body:"
            cat "$HTTP_BODY"
            echo
            FINAL_BODY="$HTTP_BODY"
            FINAL_STATUS="$HTTP_CODE"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              SUCCESS=1
              break
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Non-2xx response received. Retrying once..."
              sleep 5
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "News refresh failed after $MAX_ATTEMPTS attempts." >&2
            exit 1
          fi

          RESPONSE_PATH="$FINAL_BODY" HTTP_STATUS="$FINAL_STATUS" EXPECTED_MODE="news" node <<'NODE'
          const fs = require("fs");
          const body = fs.readFileSync(process.env.RESPONSE_PATH, "utf8");
          const status = Number(process.env.HTTP_STATUS);
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          if (!Number.isFinite(status) || status < 200 || status >= 300) fail(`Unexpected HTTP status ${process.env.HTTP_STATUS}`);
          let parsed;
          try {
            parsed = JSON.parse(body);
          } catch (err) {
            fail(`Response JSON parse failed: ${err.message}`);
          }
          const result = parsed.result ?? {};
          console.log("Parsed success:", parsed.success);
          console.log("Parsed result.ok:", result.ok);
          console.log("Parsed result.mode:", result.mode);
          console.log("Parsed result.refreshMode:", result.refreshMode);
          console.log("Parsed lastNewsRefreshAt:", result.lastNewsRefreshAt);
          console.log("Parsed freshnessOutcome:", result.freshnessOutcome ?? "n/a");
          const diagnostics = Array.isArray(result.providerDiagnostics) ? result.providerDiagnostics : [];
          console.log("Provider diagnostics summary:", diagnostics.map((item) => `${item.provider}:${item.fetched ?? 0}/${item.status ?? "checked"}`).join(", ") || "none");
          if (parsed.success !== true) fail("Refresh response success !== true");
          if (result.ok !== true) fail("Refresh result.ok !== true");
          if (result.mode !== "news" && result.refreshMode !== "news") fail("Refresh result mode mismatch");
          if (!result.lastNewsRefreshAt) fail("Refresh response lacks lastNewsRefreshAt");
          if (diagnostics.length === 0) fail("News refresh returned no provider diagnostics");
          if (result.heartbeatPersisted !== true) fail("Scheduled news heartbeat was not persisted");
          if (result.heartbeatReadBack !== true) fail("Scheduled news heartbeat did not read back");
          if (result.persistenceSource !== "supabase") fail(`Scheduled news heartbeat used non-durable persistence: ${result.persistenceSource}`);
          if (/unknown route|unauthorized/i.test(body)) fail("Refresh response contained route/auth failure text");
          NODE

          HEALTH_BODY=$(mktemp)
          HEALTH_STATUS=$(curl -sS --max-time 45 --connect-timeout 15 -o "$HEALTH_BODY" -w "%{http_code}" "$GRIGORI_HEALTH_URL")
          echo "Health HTTP status: $HEALTH_STATUS"
          echo "Health body:"
          cat "$HEALTH_BODY"
          echo

          HEALTH_BODY="$HEALTH_BODY" HEALTH_STATUS="$HEALTH_STATUS" node <<'NODE'
          const fs = require("fs");
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          const status = Number(process.env.HEALTH_STATUS);
          if (!Number.isFinite(status) || status < 200 || status >= 300) fail(`Unexpected health HTTP status ${process.env.HEALTH_STATUS}`);
          let health;
          try {
            health = JSON.parse(fs.readFileSync(process.env.HEALTH_BODY, "utf8"));
          } catch (err) {
            fail(`Health JSON parse failed: ${err.message}`);
          }
          const automation = health.automation ?? {};
          const news = automation.news ?? {};
          const lastSuccess = news.lastScheduledSuccessAt;
          const lastNewsRefreshAt = automation.lastNewsRefreshAt ?? health.data?.lastNewsRefreshAt ?? health.data?.lastNewsCheckAt;
          const ageMinutes = lastSuccess ? (Date.now() - new Date(lastSuccess).getTime()) / 60000 : Infinity;
          console.log("Health scheduled news:", JSON.stringify(news));
          console.log("Health lastNewsRefreshAt:", lastNewsRefreshAt ?? "missing");
          if (!lastSuccess || ageMinutes > 10) fail("Health did not show scheduled news success within 10 minutes");
          if (!lastNewsRefreshAt) fail("Health did not show lastNewsRefreshAt/check timestamp");
          if (health.data?.supabaseStatus && health.data.supabaseStatus !== "ok") fail(`Health reports Supabase status ${health.data.supabaseStatus}: ${health.data.supabaseError ?? "unknown"}`);
          NODE

          echo "News refresh validated successfully."
